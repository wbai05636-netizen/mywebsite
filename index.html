<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>丛林保卫战 | Jungle Defender</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 9 / 5;
            max-height: 95vh;
            margin: 8px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8E8 40%, #7CB342 55%, #558B2F 100%);
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-pill {
            background: rgba(0,0,0,0.55);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .hud-pill .icon { font-size: 16px; }
        .hud-pill.score { color: #FFD700; }
        .hud-pill.wave { color: #FF6B6B; }

        .health-bar {
            width: 120px;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #E74C3C, #FF6B6B);
            transition: width 0.3s ease;
            border-radius: 5px;
        }

        /* Start / Game Over Screen */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(20, 20, 40, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(6px);
            text-align: center;
            padding: 20px;
        }

        .overlay.hidden { display: none; }

        .overlay h1 {
            font-size: 38px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 3px 3px 0 #c0392b, 6px 6px 12px rgba(0,0,0,0.5);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .overlay h1 .sub { color: #4A90D9; }

        .overlay p {
            color: #ccc;
            font-size: 16px;
            margin-bottom: 24px;
            max-width: 420px;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 28px;
            font-weight: 800;
            color: #FFD700;
            margin-bottom: 8px;
        }

        .overlay .final-wave {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .play-btn {
            padding: 16px 48px;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #4A90D9, #5B8DEF);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(74,144,217,0.5);
            letter-spacing: 1px;
        }

        .play-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 30px rgba(74,144,217,0.7); }
        .play-btn:active { transform: translateY(0) scale(0.98); }

        .controls-hint {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .key-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #aaa;
            font-size: 13px;
        }

        .key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            padding: 0 8px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        /* Mobile controls */
        .mobile-ctrl {
            position: absolute;
            bottom: 12px;
            left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 15;
            pointer-events: none;
        }

        .mobile-ctrl > * { pointer-events: auto; }

        .dpad {
            display: flex;
            gap: 8px;
        }

        .mbtn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: background 0.15s;
        }

        .mbtn:active { background: rgba(74,144,217,0.6); transform: scale(0.92); }

        .mbtn.fire {
            width: 72px; height: 72px;
            background: rgba(231,76,60,0.5);
            border-color: rgba(231,76,60,0.8);
            font-size: 28px;
        }

        .mbtn.fire:active { background: rgba(231,76,60,0.8); }

        .mbtn.jump {
            width: 64px; height: 64px;
            background: rgba(74,144,217,0.5);
            border-color: rgba(74,144,217,0.8);
            font-size: 24px;
        }

        .mbtn.jump:active { background: rgba(74,144,217,0.8); }

        .mobile-ctrl { display: none; }
        .controls-hint { display: flex; }

        @media (pointer: coarse) {
            .mobile-ctrl { display: flex; }
            .controls-hint { display: none; }
        }

        @media (max-width: 600px) {
            .overlay h1 { font-size: 26px; }
            .overlay p { font-size: 14px; }
            .hud-pill { font-size: 12px; padding: 5px 10px; }
            .health-bar { width: 80px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="hud" id="hud" style="display:none">
        <div class="hud-left">
            <div class="hud-pill">
                <span class="icon">&#10084;</span>
                <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
            </div>
            <div class="hud-pill wave">第 <span id="waveNum">1</span> 波</div>
        </div>
        <div class="hud-right">
            <div class="hud-pill score">&#11088; <span id="scoreNum">0</span></div>
            <div class="hud-pill">&#127937; <span id="killNum">0</span></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="overlay" id="startScreen">
        <h1>丛林<span class="sub">保卫战</span></h1>
        <p>丛林深处，怪物来袭！操控勇者，射击敌人，跳跃躲避，生存到底！</p>
        <div class="controls-hint">
            <div class="key-hint"><span class="key">A</span><span class="key">D</span> 左右移动</div>
            <div class="key-hint"><span class="key">W</span> / <span class="key">Space</span> 跳跃</div>
            <div class="key-hint"><span class="key">J</span> 射击</div>
        </div>
        <button class="play-btn" onclick="startGame()">开始游戏</button>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay hidden" id="gameOverScreen">
        <h1>游戏结束</h1>
        <div class="final-score" id="finalScore">0 分</div>
        <div class="final-wave" id="finalWave">坚持到第 1 波</div>
        <button class="play-btn" onclick="startGame()">再来一局</button>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-ctrl">
        <div class="dpad">
            <button class="mbtn" id="btnLeft">&#9664;</button>
            <button class="mbtn" id="btnRight">&#9654;</button>
        </div>
        <div class="dpad">
            <button class="mbtn jump" id="btnJump">&#8593;</button>
            <button class="mbtn fire" id="btnFire">&#128293;</button>
        </div>
    </div>
</div>

<script>
// ==============================================
// 丛林保卫战 - Canvas Game Engine
// ==============================================

var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');

var W, H;
function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width;
    H = canvas.height;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// === Game State ===
var game = {
    state: 'menu',
    score: 0,
    kills: 0,
    wave: 1,
    waveTimer: 0,
    enemiesPerWave: 5,
    enemiesSpawned: 0,
    enemiesKilled: 0,
    spawnCooldown: 0,
    cameraX: 0,
    groundY: 0,
    time: 0
};

// === Physics ===
var GRAVITY = 0.6;
var FRICTION = 0.82;

// === Player ===
var player = {
    x: 100, y: 0,
    vx: 0, vy: 0,
    w: 32, h: 44,
    onGround: false,
    facing: 1,
    hp: 100, maxHp: 100,
    shootCooldown: 0,
    invincible: 0,
    animFrame: 0,
    animTimer: 0
};

// === Arrays ===
var bullets = [];
var enemies = [];
var particles = [];
var platforms = [];
var pickups = [];
var clouds = [];
var trees = [];

// === Input ===
var keys = {};
var mobileInput = { left: false, right: false, jump: false, fire: false };

window.addEventListener('keydown', function(e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (e.key === ' ') { keys[' '] = true; e.preventDefault(); }
});
window.addEventListener('keyup', function(e) {
    var k = e.key.toLowerCase();
    keys[k] = false;
    if (e.key === ' ') keys[' '] = false;
});

// Mobile controls
function bindMobile(id, prop) {
    var btn = document.getElementById(id);
    ['touchstart','mousedown'].forEach(function(ev) {
        btn.addEventListener(ev, function(e) { e.preventDefault(); mobileInput[prop] = true; });
    });
    ['touchend','mouseup','touchcancel','mouseleave'].forEach(function(ev) {
        btn.addEventListener(ev, function(e) { e.preventDefault(); mobileInput[prop] = false; });
    });
}
bindMobile('btnLeft', 'left');
bindMobile('btnRight', 'right');
bindMobile('btnJump', 'jump');
bindMobile('btnFire', 'fire');

function isLeft()  { return keys['a'] || keys['arrowleft'] || mobileInput.left; }
function isRight() { return keys['d'] || keys['arrowright'] || mobileInput.right; }
function isJump()  { return keys['w'] || keys['arrowup'] || keys[' '] || mobileInput.jump; }
function isFire()  { return keys['j'] || mobileInput.fire; }

// === Audio (simple beeps) ===
var audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
}
function playSound(freq, duration, type) {
    var ctx2 = getAudio();
    if (!ctx2) return;
    var osc = ctx2.createOscillator();
    var gain = ctx2.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx2.destination);
    gain.gain.setValueAtTime(0.15, ctx2.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + duration);
    osc.start();
    osc.stop(ctx2.currentTime + duration);
}
function sndShoot() { playSound(800, 0.08, 'square'); }
function sndHit()   { playSound(200, 0.15, 'sawtooth'); }
function sndJump()  { playSound(400, 0.1, 'sine'); }
function sndPickup(){ playSound(600, 0.1, 'sine'); setTimeout(function(){playSound(900,0.1,'sine');},80); }
function sndDie()   { playSound(150, 0.3, 'sawtooth'); }
function sndWin()   { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){playSound(f,0.15,'sine');}, i*120); }); }

// === Initialize Level ===
function initLevel() {
    game.groundY = H - 60;

    // Platforms
    platforms = [
        { x: 0, y: game.groundY, w: W, h: 60, type: 'ground' },
        { x: W * 0.15, y: game.groundY - 80, w: 100, h: 14, type: 'float' },
        { x: W * 0.38, y: game.groundY - 130, w: 100, h: 14, type: 'float' },
        { x: W * 0.60, y: game.groundY - 90, w: 100, h: 14, type: 'float' },
        { x: W * 0.78, y: game.groundY - 150, w: 100, h: 14, type: 'float' }
    ];

    // Clouds
    clouds = [];
    for (var i = 0; i < 5; i++) {
        clouds.push({
            x: Math.random() * W,
            y: 20 + Math.random() * 80,
            w: 60 + Math.random() * 40,
            speed: 0.2 + Math.random() * 0.3
        });
    }

    // Trees (background)
    trees = [];
    for (var t = 0; t < 8; t++) {
        trees.push({
            x: t * (W / 7) + Math.random() * 30,
            h: 80 + Math.random() * 40,
            w: 40 + Math.random() * 20
        });
    }

    // Reset player
    player.x = 80;
    player.y = game.groundY - player.h;
    player.vx = 0;
    player.vy = 0;
    player.hp = player.maxHp;
    player.facing = 1;
    player.invincible = 0;
    player.shootCooldown = 0;

    bullets = [];
    enemies = [];
    particles = [];
    pickups = [];

    game.score = 0;
    game.kills = 0;
    game.wave = 1;
    game.enemiesPerWave = 5;
    game.enemiesSpawned = 0;
    game.enemiesKilled = 0;
    game.spawnCooldown = 60;
    game.time = 0;
}

// === Start Game ===
function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    initLevel();
    game.state = 'playing';
    updateHUD();
}

// === Spawn Enemy ===
function spawnEnemy() {
    var types = ['walker', 'flyer', 'walker'];
    if (game.wave >= 2) types.push('flyer', 'tank');
    if (game.wave >= 3) types.push('tank', 'flyer');

    var type = types[Math.floor(Math.random() * types.length)];
    var side = Math.random() > 0.5 ? 1 : -1;
    var ex = side > 0 ? -30 : W + 30;

    var e;
    if (type === 'walker') {
        e = { type: type, x: ex, y: game.groundY - 30, w: 30, h: 30, vx: -side * (1 + game.wave * 0.15), vy: 0, hp: 2, maxHp: 2, onGround: true, animTimer: 0, hitFlash: 0 };
    } else if (type === 'flyer') {
        e = { type: type, x: ex, y: game.groundY - 120 - Math.random() * 60, w: 28, h: 28, vx: -side * (1.5 + game.wave * 0.2), vy: 0, hp: 1, maxHp: 1, onGround: false, animTimer: 0, hitFlash: 0, baseY: 0 };
        e.baseY = e.y;
    } else { // tank
        e = { type: type, x: ex, y: game.groundY - 40, w: 38, h: 38, vx: -side * (0.8 + game.wave * 0.1), vy: 0, hp: 4, maxHp: 4, onGround: true, animTimer: 0, hitFlash: 0 };
    }
    enemies.push(e);
    game.enemiesSpawned++;
}

// === Shoot ===
function shoot() {
    if (player.shootCooldown > 0) return;
    player.shootCooldown = 12;

    var bx = player.x + player.w / 2 + player.facing * 20;
    var by = player.y + player.h * 0.35;

    bullets.push({
        x: bx, y: by,
        vx: player.facing * 9,
        w: 8, h: 4,
        life: 80
    });
    sndShoot();
}

// === Particles ===
function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 20 + Math.random() * 15,
            maxLife: 35,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

// === Collision ===
function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// === Update ===
function update() {
    if (game.state !== 'playing') return;
    game.time++;

    // Player movement
    var speed = 4;
    if (isLeft())  { player.vx = -speed; player.facing = -1; }
    else if (isRight()) { player.vx = speed; player.facing = 1; }
    else player.vx *= FRICTION;

    if (isJump() && player.onGround) {
        player.vy = -12;
        player.onGround = false;
        sndJump();
    }

    // Shoot
    if (isFire()) shoot();
    if (player.shootCooldown > 0) player.shootCooldown--;
    if (player.invincible > 0) player.invincible--;

    // Gravity
    player.vy += GRAVITY;
    if (player.vy > 15) player.vy = 15;

    // Apply movement
    player.x += player.vx;
    player.y += player.vy;

    // Player bounds
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;

    // Platform collision
    player.onGround = false;
    for (var pi = 0; pi < platforms.length; pi++) {
        var p = platforms[pi];
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            if (player.y + player.h > p.y && player.y + player.h < p.y + p.h + 15 && player.vy >= 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    }

    // Fall death
    if (player.y > H + 100) {
        player.hp = 0;
    }

    // Player animation
    player.animTimer++;
    if (player.animTimer > 6) {
        player.animTimer = 0;
        player.animFrame = (player.animFrame + 1) % 4;
    }

    // Spawn enemies
    if (game.enemiesSpawned < game.enemiesPerWave) {
        game.spawnCooldown--;
        if (game.spawnCooldown <= 0) {
            spawnEnemy();
            game.spawnCooldown = 50 + Math.random() * 60 - game.wave * 3;
            if (game.spawnCooldown < 20) game.spawnCooldown = 20;
        }
    }

    // Wave complete
    if (game.enemiesKilled >= game.enemiesPerWave) {
        game.wave++;
        game.enemiesPerWave = 5 + game.wave * 2;
        game.enemiesSpawned = 0;
        game.enemiesKilled = 0;
        game.spawnCooldown = 60;
        sndWin();
        showToast('第 ' + game.wave + ' 波来袭！');
        // Spawn health pickup
        pickups.push({ x: W/2, y: game.groundY - 100, vy: 0, type: 'health', bob: 0, collected: false });
    }

    // Update bullets
    for (var bi = bullets.length - 1; bi >= 0; bi--) {
        var b = bullets[bi];
        b.x += b.vx;
        b.life--;
        if (b.life <= 0 || b.x < -20 || b.x > W + 20) {
            bullets.splice(bi, 1);
            continue;
        }
        // Bullet vs enemy
        for (var ei = 0; ei < enemies.length; ei++) {
            var e = enemies[ei];
            if (rectCollide(b, e)) {
                e.hp--;
                e.hitFlash = 8;
                spawnParticles(b.x, b.y, '#FFD700', 3);
                bullets.splice(bi, 1);
                sndHit();
                if (e.hp <= 0) {
                    spawnParticles(e.x + e.w/2, e.y + e.h/2, '#FF6B6B', 8);
                    game.score += e.type === 'tank' ? 30 : e.type === 'flyer' ? 15 : 10;
                    game.kills++;
                    game.enemiesKilled++;
                    // Chance to drop coin
                    if (Math.random() < 0.3) {
                        pickups.push({ x: e.x + e.w/2, y: e.y, vy: -3, type: 'coin', bob: 0, collected: false });
                    }
                    enemies.splice(ei, 1);
                }
                break;
            }
        }
    }

    // Update enemies
    for (var ei2 = enemies.length - 1; ei2 >= 0; ei2--) {
        var en = enemies[ei2];
        if (en.hitFlash > 0) en.hitFlash--;
        en.animTimer++;

        if (en.type === 'flyer') {
            en.x += en.vx;
            en.y = en.baseY + Math.sin(en.animTimer * 0.05) * 25;
        } else {
            // Walker / Tank
            en.vy += GRAVITY;
            if (en.vy > 12) en.vy = 12;
            en.x += en.vx;
            en.y += en.vy;

            // Ground collision
            if (en.y + en.h > game.groundY) {
                en.y = game.groundY - en.h;
                en.vy = 0;
                en.onGround = true;
            }

            // Platform collision
            for (var pi2 = 0; pi2 < platforms.length; pi2++) {
                var pf = platforms[pi2];
                if (en.x + en.w > pf.x && en.x < pf.x + pf.w) {
                    if (en.y + en.h > pf.y && en.y + en.h < pf.y + pf.h + 10 && en.vy >= 0) {
                        en.y = pf.y - en.h;
                        en.vy = 0;
                    }
                }
            }

            // Turn around at edges
            if (en.x < -50) en.x = W + 30;
            if (en.x > W + 50) en.x = -30;
        }

        // Enemy vs player
        if (player.invincible <= 0 && rectCollide(player, en)) {
            player.hp -= en.type === 'tank' ? 25 : 15;
            player.invincible = 60;
            player.vx = (player.x < en.x ? -1 : 1) * 6;
            player.vy = -6;
            spawnParticles(player.x + player.w/2, player.y + player.h/2, '#E74C3C', 5);
            sndDie();
            if (player.hp <= 0) {
                player.hp = 0;
                gameOver();
            }
        }
    }

    // Update particles
    for (var pi3 = particles.length - 1; pi3 >= 0; pi3--) {
        var pt = particles[pi3];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.2;
        pt.life--;
        if (pt.life <= 0) particles.splice(pi3, 1);
    }

    // Update pickups
    for (var pki = pickups.length - 1; pki >= 0; pki--) {
        var pk = pickups[pki];
        pk.vy += 0.3;
        pk.y += pk.vy;
        pk.bob += 0.1;
        if (pk.y + 20 > game.groundY) {
            pk.y = game.groundY - 20;
            pk.vy = 0;
        }
        // Pickup vs player
        var pkBox = { x: pk.x - 12, y: pk.y - 12, w: 24, h: 24 };
        if (!pk.collected && rectCollide(player, pkBox)) {
            pk.collected = true;
            if (pk.type === 'health') {
                player.hp = Math.min(player.maxHp, player.hp + 30);
                sndPickup();
                showToast('+30 生命值！');
            } else if (pk.type === 'coin') {
                game.score += 5;
                sndPickup();
            }
            pickups.splice(pki, 1);
        }
    }

    // Update clouds
    clouds.forEach(function(c) {
        c.x -= c.speed;
        if (c.x + c.w < 0) c.x = W;
    });

    updateHUD();
}

function updateHUD() {
    document.getElementById('scoreNum').textContent = game.score;
    document.getElementById('killNum').textContent = game.kills;
    document.getElementById('waveNum').textContent = game.wave;
    var hpPct = Math.max(0, player.hp / player.maxHp * 100);
    document.getElementById('healthFill').style.width = hpPct + '%';
}

function gameOver() {
    game.state = 'gameover';
    document.getElementById('finalScore').textContent = game.score + ' 分';
    document.getElementById('finalWave').textContent = '坚持到第 ' + game.wave + ' 波';
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

// === Toast (in-game) ===
var gameToast = null;
function showToast(msg) {
    if (!gameToast) {
        gameToast = document.createElement('div');
        gameToast.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#FFD700;padding:12px 28px;border-radius:8px;font-size:18px;font-weight:700;z-index:15;transition:opacity 0.4s;pointer-events:none;white-space:nowrap;';
        document.querySelector('.game-container').appendChild(gameToast);
    }
    gameToast.textContent = msg;
    gameToast.style.opacity = '1';
    clearTimeout(gameToast._t);
    gameToast._t = setTimeout(function() { gameToast.style.opacity = '0'; }, 1500);
}

// === Draw ===
function draw() {
    ctx.clearRect(0, 0, W, H);

    // Sky gradient (already on canvas bg, but draw for control)
    var skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#87CEEB');
    skyGrad.addColorStop(0.4, '#98D8E8');
    skyGrad.addColorStop(0.55, '#B5E8B5');
    skyGrad.addColorStop(1, '#558B2F');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Sun
    ctx.fillStyle = 'rgba(255, 235, 130, 0.8)';
    ctx.beginPath();
    ctx.arc(W * 0.82, 60, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 235, 130, 0.3)';
    ctx.beginPath();
    ctx.arc(W * 0.82, 60, 40, 0, Math.PI * 2);
    ctx.fill();

    // Clouds
    clouds.forEach(function(c) {
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.w * 0.3, 0, Math.PI * 2);
        ctx.arc(c.x + c.w * 0.25, c.y - 4, c.w * 0.25, 0, Math.PI * 2);
        ctx.arc(c.x + c.w * 0.5, c.y, c.w * 0.3, 0, Math.PI * 2);
        ctx.arc(c.x + c.w * 0.25, c.y + 6, c.w * 0.2, 0, Math.PI * 2);
        ctx.fill();
    });

    // Trees (background)
    trees.forEach(function(t) {
        // Trunk
        ctx.fillStyle = '#6D4C41';
        ctx.fillRect(t.x - 5, game.groundY - t.h, 10, t.h);
        // Leaves
        ctx.fillStyle = '#2E7D32';
        ctx.beginPath();
        ctx.arc(t.x, game.groundY - t.h, t.w * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#388E3C';
        ctx.beginPath();
        ctx.arc(t.x - t.w * 0.2, game.groundY - t.h - 10, t.w * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(t.x + t.w * 0.2, game.groundY - t.h - 5, t.w * 0.3, 0, Math.PI * 2);
        ctx.fill();
    });

    // Platforms
    platforms.forEach(function(p) {
        if (p.type === 'ground') {
            // Ground
            var groundGrad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
            groundGrad.addColorStop(0, '#8BC34A');
            groundGrad.addColorStop(0.15, '#689F38');
            groundGrad.addColorStop(1, '#33691E');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // Grass tufts
            ctx.fillStyle = '#7CB342';
            for (var gx = p.x; gx < p.x + p.w; gx += 15) {
                ctx.fillRect(gx, p.y - 3, 4, 6);
                ctx.fillRect(gx + 6, p.y - 2, 3, 4);
            }
        } else {
            // Floating platform
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#8BC34A';
            ctx.fillRect(p.x, p.y, p.w, 4);
        }
    });

    // Pickups
    pickups.forEach(function(pk) {
        var bob = Math.sin(pk.bob) * 3;
        if (pk.type === 'health') {
            ctx.fillStyle = '#E74C3C';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('&#10084;', pk.x, pk.y + bob + 5);
            // Draw as shape instead
            ctx.beginPath();
            ctx.arc(pk.x, pk.y + bob, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#E74C3C';
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('+', pk.x, pk.y + bob + 5);
        } else {
            ctx.beginPath();
            ctx.arc(pk.x, pk.y + bob, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.strokeStyle = '#FFA000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#FFA000';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('$', pk.x, pk.y + bob + 3);
        }
    });

    // Bullets
    bullets.forEach(function(b) {
        ctx.fillStyle = '#FFD700';
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 6;
        ctx.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
        ctx.shadowBlur = 0;
        // Trail
        ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
        ctx.fillRect(b.x - b.vx, b.y, b.w, b.h);
    });

    // Enemies
    enemies.forEach(function(e) {
        var ex = e.x, ey = e.y, ew = e.w, eh = e.h;
        var flash = e.hitFlash > 0;

        if (e.type === 'walker') {
            // Red slime
            ctx.fillStyle = flash ? '#fff' : '#E53935';
            ctx.beginPath();
            ctx.arc(ex + ew/2, ey + eh/2, ew/2, 0, Math.PI * 2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ex + ew * 0.35, ey + eh * 0.4, 3, 0, Math.PI * 2);
            ctx.arc(ex + ew * 0.65, ey + eh * 0.4, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(ex + ew * 0.35 + e.vx * 0.5, ey + eh * 0.4, 1.5, 0, Math.PI * 2);
            ctx.arc(ex + ew * 0.65 + e.vx * 0.5, ey + eh * 0.4, 1.5, 0, Math.PI * 2);
            ctx.fill();
        } else if (e.type === 'flyer') {
            // Flying bat
            ctx.fillStyle = flash ? '#fff' : '#6A1B9A';
            ctx.beginPath();
            ctx.ellipse(ex + ew/2, ey + eh/2, ew * 0.4, eh * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            // Wings
            var wingFlap = Math.sin(e.animTimer * 0.3) * 8;
            ctx.beginPath();
            ctx.moveTo(ex + ew * 0.2, ey + eh * 0.4);
            ctx.lineTo(ex - 6, ey - wingFlap);
            ctx.lineTo(ex + ew * 0.3, ey + eh * 0.5);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(ex + ew * 0.8, ey + eh * 0.4);
            ctx.lineTo(ex + ew + 6, ey - wingFlap);
            ctx.lineTo(ex + ew * 0.7, ey + eh * 0.5);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#FF1744';
            ctx.beginPath();
            ctx.arc(ex + ew * 0.4, ey + eh * 0.45, 2, 0, Math.PI * 2);
            ctx.arc(ex + ew * 0.6, ey + eh * 0.45, 2, 0, Math.PI * 2);
            ctx.fill();
        } else { // tank
            ctx.fillStyle = flash ? '#fff' : '#4E342E';
            ctx.fillRect(ex, ey, ew, eh);
            // Spikes
            ctx.fillStyle = flash ? '#fff' : '#795548';
            for (var sx = 0; sx < 4; sx++) {
                ctx.beginPath();
                ctx.moveTo(ex + sx * 10 + 2, ey);
                ctx.lineTo(ex + sx * 10 + 7, ey - 8);
                ctx.lineTo(ex + sx * 10 + 12, ey);
                ctx.fill();
            }
            // Eyes
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(ex + ew * 0.3, ey + eh * 0.5, 3, 0, Math.PI * 2);
            ctx.arc(ex + ew * 0.7, ey + eh * 0.5, 3, 0, Math.PI * 2);
            ctx.fill();
            // HP bar
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(ex, ey - 8, ew, 4);
            ctx.fillStyle = '#E53935';
            ctx.fillRect(ex, ey - 8, ew * (e.hp / e.maxHp), 4);
        }
    });

    // Player
    if (game.state === 'playing' || game.state === 'gameover') {
        var px = player.x, py = player.y, pw = player.w, ph = player.h;
        var flicker = player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0;

        if (!flicker) {
            // Body
            ctx.fillStyle = '#1565C0';
            ctx.fillRect(px + 4, py + 12, pw - 8, ph - 16);
            // Head
            ctx.fillStyle = '#FFB74D';
            ctx.beginPath();
            ctx.arc(px + pw/2, py + 10, 10, 0, Math.PI * 2);
            ctx.fill();
            // Hair
            ctx.fillStyle = '#5D4037';
            ctx.beginPath();
            ctx.arc(px + pw/2, py + 6, 10, Math.PI, 0);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#000';
            var eyeDir = player.facing * 2;
            ctx.beginPath();
            ctx.arc(px + pw/2 - 4 + eyeDir, py + 10, 1.5, 0, Math.PI * 2);
            ctx.arc(px + pw/2 + 4 + eyeDir, py + 10, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Arms
            ctx.fillStyle = '#FFB74D';
            var armSwing = player.onGround && Math.abs(player.vx) > 0.5 ? Math.sin(player.animFrame * Math.PI / 2) * 4 : 0;
            ctx.fillRect(px + 2, py + 14 + armSwing, 5, 12);
            ctx.fillRect(px + pw - 7, py + 14 - armSwing, 5, 12);
            // Legs
            ctx.fillStyle = '#37474F';
            var legSwing = player.onGround && Math.abs(player.vx) > 0.5 ? Math.sin(player.animFrame * Math.PI / 2) * 5 : 0;
            ctx.fillRect(px + 6, py + ph - 8 + legSwing, 7, 8);
            ctx.fillRect(px + pw - 13, py + ph - 8 - legSwing, 7, 8);
            // Gun
            ctx.fillStyle = '#455A64';
            ctx.fillRect(px + pw/2 + (player.facing > 0 ? pw/2 : -pw/2 - 4), py + 18, 4, 6);
            ctx.fillRect(px + pw/2 + (player.facing > 0 ? pw/2 - 2 : -pw/2), py + 19, 8, 4);
        }
    }

    // Particles
    particles.forEach(function(pt) {
        var alpha = pt.life / pt.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x - pt.size/2, pt.y - pt.size/2, pt.size, pt.size);
        ctx.globalAlpha = 1;
    });

    // Wave banner
    if (game.time < 90 && game.state === 'playing') {
        var bannerAlpha = game.time < 20 ? game.time / 20 : game.time > 70 ? (90 - game.time) / 20 : 1;
        ctx.globalAlpha = bannerAlpha;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(W/2 - 100, H/2 - 25, 200, 50);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('第 ' + game.wave + ' 波', W/2, H/2 + 8);
        ctx.globalAlpha = 1;
    }
}

// === Game Loop ===
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
